services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arbitra-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./arbitration_logs.jsonl:/app/arbitration_logs.jsonl
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: arbitra-frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped